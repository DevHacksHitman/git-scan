name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the self-scan test reads the full history

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: the tool has zero third-party dependencies.
      - name: Test suite (zero network, zero packages)
        run: python3 -m unittest discover -s tests -t . -v

      - name: Self-scan — this repository must be clean under its own rules
        run: python3 history_scan.py --worktree --fail-on low
